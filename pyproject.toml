[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mindslice-tui"
version = "0.1.0"
description = "Terminal UI for browsing MindSlice cards, slices and their relations, reviewing staged changes and baking slices."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "pancerZH" }]
requires-python = ">=3.12"
dependencies = ["mindslice>=0.1.6", "textual>=8.2"]
keywords = ["llm", "agents", "memory", "tui", "textual", "mindslice"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Homepage = "https://github.com/pancerZH/MindSlice-tui"
Issues = "https://github.com/pancerZH/MindSlice-tui/issues"
MindSlice = "https://github.com/pancerZH/MindSlice"

[project.scripts]
mindslice-tui = "mindslice_tui.__main__:main"

[tool.setuptools]
packages = ["mindslice_tui"]

[tool.setuptools.package-data]
mindslice_tui = ["*.tcss"]
