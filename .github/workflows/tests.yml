name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly, so a new mindslice or Textual release that breaks us shows up without a push

permissions:
  contents: read

env:
  PYTHONUTF8: "1"  # test failures print the screen, which is not ASCII; Windows would otherwise fail to print it

jobs:
  unittest:
    # The engine's file locking differs per platform (fcntl / msvcrt) and every read of the TUI goes through it.
    strategy:
      fail-fast: false  # a failure on one platform should not hide the result on the others
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the locked dependencies
        run: |
          python -m pip install uv
          uv sync --locked
      - name: Tests
        run: uv run python -m unittest discover -s tests -t . -v

  latest-dependencies:
    # store.py uses engine internals (ws.index, ws._reading), so a new mindslice release can break it.
    # This job ignores uv.lock and takes the newest mindslice and Textual that pyproject.toml allows.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the newest allowed dependencies
        run: |
          python -m pip install .
          python -m pip list
      - name: Tests
        run: python -m unittest discover -s tests -t . -v
